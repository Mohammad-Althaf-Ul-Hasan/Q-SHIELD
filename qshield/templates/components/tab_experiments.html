<div class="tab-panel" id="panel-experiments">
    <div class="row g-4">
        <div class="col-lg-8 mx-auto">
            <div class="glass-card">
                <div class="glass-card-body">
                    <div class="card-icon">🧪</div>
                    <h5 class="glass-card-title">Parameterized Experiment Controls</h5>
                    <p class="glass-card-text">Adjust QKD protocol parameters and observe results.</p>
                    <div class="row g-3 mt-2">
                        <div class="col-md-6"><label class="text-secondary small">Number of Qubits</label><input type="number" id="expQubits" class="form-control" value="256" min="32" max="1024"></div>
                        <div class="col-md-6"><label class="text-secondary small">Eve Intercept Probability</label><input type="number" id="expEveProb" class="form-control" value="0.3" step="0.05" min="0" max="1"></div>
                        <div class="col-md-6"><label class="text-secondary small">Attack Type</label><select id="expAttack" class="form-select"><option value="intercept_resend">Intercept‑Resend</option><option value="photon_number_splitting">PNS</option><option value="faked_state">Faked State</option><option value="collective">Collective</option></select></div>
                        <div class="col-md-6"><label class="text-secondary small">Noise Model</label><select id="expNoise" class="form-select"><option value="none">Noiseless</option><option value="depolarizing_low">Depolarizing (Low)</option><option value="phase_damping">Phase Damping</option><option value="atmospheric">Atmospheric</option></select></div>
                    </div>
                    <div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="expEveToggle"><label class="form-check-label small text-secondary">Enable Eavesdropper</label></div>
                    <button id="runExperimentBtn" class="btn-neon btn-neon-purple w-100 mt-3"><span class="btn-content">Run Experiment</span></button>
                    <div id="experimentResult" class="terminal-box mt-3"><div class="terminal-body">Configure parameters and run...</div></div>
                </div>
            </div>
        </div>
    </div>
</div>
