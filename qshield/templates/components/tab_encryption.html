<div class="tab-panel" id="panel-encryption">
    <div class="row g-4">
        <div class="col-lg-6 mx-auto">
            <div class="glass-card">
                <div class="glass-card-body">
                    <div class="card-icon">🔒</div>
                    <h5 class="glass-card-title">Encrypt &amp; Send</h5>
                    <p class="glass-card-text">Securely encrypt your message with the hybrid key.</p>
                    <textarea id="messageInput" class="glass-textarea" rows="3" placeholder="Type your secret message..."></textarea>
                    <button id="encryptBtn" class="btn-neon btn-neon-emerald w-100 mt-3"><span class="btn-content">Encrypt &amp; Send</span></button>
                    <div class="terminal-box mt-3">
                        <div class="terminal-header"><span class="terminal-dot dot-red"></span><span class="terminal-dot dot-yellow"></span><span class="terminal-dot dot-green"></span><span class="terminal-title">ciphertext.bin</span></div>
                        <div class="terminal-body" id="encryptTerminalBody"><span class="terminal-prompt">$</span> <span class="terminal-dim">No encrypted data yet...</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
