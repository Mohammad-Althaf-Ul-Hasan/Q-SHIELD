<div class="tab-panel active" id="panel-quantum">
    <div class="row g-4">
        <div class="col-lg-8 mx-auto">
            <div class="glass-card">
                <div class="glass-card-body">
                    <div class="card-icon">⚛️</div>
                    <h5 class="glass-card-title">Initialize Quantum Channel</h5>
                    <p class="glass-card-text">Generate hybrid keys using QKD, PQC, and quantum randomness.</p>

                    <div id="qkdNetworkViz" style="width:100%; height:250px; margin-bottom:20px;"></div>
                    <!-- Protocol Flow Timeline -->
                    <div class="protocol-flow" id="protocolFlow">
                        <div class="flow-step" data-step="prepare"><span class="flow-dot"></span><span>Prepare</span></div>
                        <div class="flow-step" data-step="transmit"><span class="flow-dot"></span><span>Transmit</span></div>
                        <div class="flow-step" data-step="measure"><span class="flow-dot"></span><span>Measure</span></div>
                        <div class="flow-step" data-step="sift"><span class="flow-dot"></span><span>Sift</span></div>
                        <div class="flow-step" data-step="qber"><span class="flow-dot"></span><span>QBER</span></div>
                        <div class="flow-step" data-step="distill"><span class="flow-dot"></span><span>Distill</span></div>
                        <div class="flow-step" data-step="final"><span class="flow-dot"></span><span>Final Key</span></div>
                    </div>

                    <button id="generateBtn" class="btn-neon btn-neon-purple w-100 mt-3"><span class="btn-content">Generate Keys</span></button>
                    <div class="terminal-box mt-3">
                        <div class="terminal-header"><span class="terminal-dot dot-red"></span><span class="terminal-dot dot-yellow"></span><span class="terminal-dot dot-green"></span><span class="terminal-title">qkd_output.log</span></div>
                        <div class="terminal-body" id="keyTerminalBody"><span class="terminal-prompt">$</span> <span class="terminal-dim">Awaiting key generation...</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
