<div class="tab-panel" id="panel-analysis">
    <div class="row g-4">
        <div class="col-md-6">
            <div class="glass-card h-100">
                <div class="glass-card-body text-center">
                    <h5 class="glass-card-title">📈 Quantum Bit Error Rate</h5>
                    <svg class="qber-svg-gauge" viewBox="0 0 220 130">
                        <path class="qber-gauge-bg" d="M30 110 A85 85 0 0 1 190 110"/>
                        <path id="qberGaugeFill" class="qber-gauge-fill safe" d="M30 110 A85 85 0 0 1 190 110"/>
                    </svg>
                    <div class="qber-gauge-value mt-2" id="qberGaugeValue">--%</div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="glass-card h-100">
                <div class="glass-card-body">
                    <h5 class="glass-card-title">📊 Key Metrics</h5>
                    <div class="d-flex align-items-end justify-content-center" style="height:120px; gap:12px;">
                        <div class="text-center">
                            <div class="sparkline-bar" id="barRaw" style="height:30%;"></div>
                            <small class="text-secondary d-block mt-1">Raw</small>
                        </div>
                        <div class="text-center">
                            <div class="sparkline-bar" id="barSifted" style="height:30%;"></div>
                            <small class="text-secondary d-block mt-1">Sifted</small>
                        </div>
                        <div class="text-center">
                            <div class="sparkline-bar" id="barFinal" style="height:30%; background:linear-gradient(180deg,#10b981,#34d399);"></div>
                            <small class="text-secondary d-block mt-1">Final</small>
                        </div>
                    </div>
                    <div id="keyMetricsText" class="mt-3 small text-secondary text-center">Run a protocol to see metrics</div>
                </div>
            </div>
        </div>
    </div>
    <!-- Chart.js Charts Row -->
    <div class="row g-4 mt-2">
        <div class="col-md-6">
            <div class="glass-card"><div class="glass-card-body"><h5 class="glass-card-title">📉 QBER History</h5><canvas id="qberHistoryChart" height="200"></canvas></div></div>
        </div>
        <div class="col-md-6">
            <div class="glass-card"><div class="glass-card-body"><h5 class="glass-card-title">📊 Bit Distribution</h5><canvas id="bitDistChart" height="200"></canvas></div></div>
        </div>
    </div>
</div>
